<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" fill="none">
  <defs>
    <linearGradient id="bgI" x1="0" y1="0" x2="680" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#e8f0ff"/>
    </linearGradient>
    <linearGradient id="icoI" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c8ff5"/>
      <stop offset="100%" stop-color="#a78bf5"/>
    </linearGradient>
    <filter id="shI" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="680" height="240" rx="16" fill="url(#bgI)"/>

  <text x="340" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1a2130">iOS Icon Sizes — Visual Scale Comparison</text>
  <text x="340" y="46" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#6b7280">From App Store (1024px) down to Notification (40px) — all from one source image</text>

  <!-- App Store 1024 (shown as 100px) -->
  <g transform="translate(36, 62)">
    <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#icoI)" filter="url(#shI)"/>
    <text x="50" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#fff">A</text>
    <text x="50" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#374151">App Store</text>
    <text x="50" y="134" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6c8ff5" font-weight="600">1024×1024</text>
  </g>

  <!-- Home Screen 180 (shown as 72px) -->
  <g transform="translate(170, 76)">
    <rect x="0" y="0" width="72" height="72" rx="16" fill="url(#icoI)" filter="url(#shI)"/>
    <text x="36" y="44" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#fff">A</text>
    <text x="36" y="92" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#374151">Home Screen</text>
    <text x="36" y="106" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6c8ff5" font-weight="600">180×180</text>
  </g>

  <!-- Spotlight 120 (shown as 50px) -->
  <g transform="translate(286, 87)">
    <rect x="0" y="0" width="50" height="50" rx="12" fill="url(#icoI)" filter="url(#shI)"/>
    <text x="25" y="34" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#fff">A</text>
    <text x="25" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#374151">Spotlight</text>
    <text x="25" y="84" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6c8ff5" font-weight="600">120×120</text>
  </g>

  <!-- Settings 58 (shown as 36px) -->
  <g transform="translate(382, 94)">
    <rect x="0" y="0" width="36" height="36" rx="8" fill="url(#icoI)" filter="url(#shI)"/>
    <text x="18" y="24" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#fff">A</text>
    <text x="18" y="56" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#374151">Settings</text>
    <text x="18" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6c8ff5" font-weight="600">58×58</text>
  </g>

  <!-- Notification 40 (shown as 24px) -->
  <g transform="translate(464, 100)">
    <rect x="0" y="0" width="24" height="24" rx="6" fill="url(#icoI)" filter="url(#shI)"/>
    <text x="12" y="17" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="700" fill="#fff">A</text>
    <text x="12" y="44" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#374151">Notification</text>
    <text x="12" y="58" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#6c8ff5" font-weight="600">40×40</text>
  </g>

  <!-- Scale arrow -->
  <line x1="36" y1="192" x2="490" y2="192" stroke="#d0d8e8" stroke-width="1"/>
  <text x="36" y="208" font-family="system-ui,sans-serif" font-size="9" fill="#9ca3af">Largest</text>
  <text x="470" y="208" text-anchor="end" font-family="system-ui,sans-serif" font-size="9" fill="#9ca3af">Smallest</text>
  <text x="263" y="224" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280" font-style="italic">Your icon must remain clear and recognizable at every size</text>

  <!-- CTA box -->
  <rect x="520" y="72" width="140" height="90" rx="10" fill="#6c8ff5" filter="url(#shI)"/>
  <text x="590" y="100" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#fff">App Icon Studio</text>
  <text x="590" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.85)">Generates all 20</text>
  <text x="590" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.85)">required iOS files</text>
  <text x="590" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#fff">in one click →</text>
</svg>