<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="680" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f0f4ff"/>
    </linearGradient>
    <linearGradient id="ico1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c8ff5"/>
      <stop offset="100%" stop-color="#a78bf5"/>
    </linearGradient>
    <linearGradient id="ico2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22a34a"/>
      <stop offset="100%" stop-color="#3dd68c"/>
    </linearGradient>
    <linearGradient id="ico3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="sh3" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="680" height="220" rx="16" fill="url(#bg3)"/>

  <text x="340" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1a2130">Design Variations — Live Shape Preview</text>
  <text x="340" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#6b7280">Preview your icon in multiple shapes before exporting</text>

  <!-- Circle variant -->
  <g transform="translate(110, 70)">
    <circle cx="55" cy="55" r="55" fill="url(#ico1)" filter="url(#sh3)"/>
    <text x="55" y="64" text-anchor="middle" font-family="system-ui,sans-serif" font-size="36" font-weight="700" fill="#fff">A</text>
    <text x="55" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#374151">Circle</text>
    <text x="55" y="146" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#9ca3af">Android, Web</text>
  </g>

  <!-- Squircle variant -->
  <g transform="translate(290, 70)">
    <rect x="0" y="0" width="110" height="110" rx="26" fill="url(#ico2)" filter="url(#sh3)"/>
    <text x="55" y="64" text-anchor="middle" font-family="system-ui,sans-serif" font-size="36" font-weight="700" fill="#fff">A</text>
    <text x="55" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#374151">Squircle</text>
    <text x="55" y="146" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#9ca3af">iOS, macOS</text>
  </g>

  <!-- Rounded Square variant -->
  <g transform="translate(470, 70)">
    <rect x="0" y="0" width="110" height="110" rx="14" fill="url(#ico3)" filter="url(#sh3)"/>
    <text x="55" y="64" text-anchor="middle" font-family="system-ui,sans-serif" font-size="36" font-weight="700" fill="#fff">A</text>
    <text x="55" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#374151">Rounded Square</text>
    <text x="55" y="146" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#9ca3af">Windows, Legacy</text>
  </g>
</svg>