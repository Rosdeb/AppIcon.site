<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" fill="none">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="680" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="shA" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="680" height="260" rx="16" fill="url(#bgA)"/>

  <text x="340" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#1a2130">Android Adaptive Icon — Layer System</text>
  <text x="340" y="46" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#6b7280">Background + Foreground layers combine and adapt to any launcher shape</text>

  <!-- Background layer -->
  <g transform="translate(40, 64)">
    <rect x="0" y="0" width="140" height="140" rx="30" fill="#22a34a" filter="url(#shA)" opacity="0.9"/>
    <text x="70" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="30" fill="#fff" opacity="0.3">BG</text>
    <text x="70" y="168" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#374151">Background Layer</text>
    <text x="70" y="184" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#9ca3af">Solid color or pattern</text>
  </g>

  <!-- Plus sign -->
  <text x="206" y="140" font-family="system-ui,sans-serif" font-size="28" font-weight="300" fill="#22a34a">+</text>

  <!-- Foreground layer -->
  <g transform="translate(236, 64)">
    <rect x="0" y="0" width="140" height="140" rx="30" fill="none" stroke="#d0d8e8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <!-- Safe zone indicator -->
    <rect x="20" y="20" width="100" height="100" rx="4" fill="none" stroke="#22a34a" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
    <text x="70" y="62" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#22a34a">72dp safe zone</text>
    <!-- Logo glyph -->
    <text x="70" y="90" text-anchor="middle" font-family="system-ui,sans-serif" font-size="36" font-weight="700" fill="#1a2130">A</text>
    <text x="70" y="168" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#374151">Foreground Layer</text>
    <text x="70" y="184" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#9ca3af">Logo within 72dp safe zone</text>
  </g>

  <!-- Equals sign -->
  <text x="402" y="140" font-family="system-ui,sans-serif" font-size="28" font-weight="300" fill="#22a34a">=</text>

  <!-- Combined result with circle mask -->
  <g transform="translate(432, 64)">
    <circle cx="70" cy="70" r="66" fill="#22a34a" filter="url(#shA)"/>
    <text x="70" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="36" font-weight="700" fill="#fff">A</text>
    <text x="70" y="168" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#374151">Combined Result</text>
    <text x="70" y="184" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#9ca3af">Circle mask applied</text>
  </g>

  <!-- Result with squircle mask (smaller) -->
  <g transform="translate(584, 80)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="#22a34a" filter="url(#shA)"/>
    <text x="40" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#fff">A</text>
    <text x="40" y="104" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#9ca3af">Squircle</text>
  </g>
</svg>