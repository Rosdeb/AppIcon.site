  <text x="424" y="208" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#0284c7">11 files total</text>

  <!-- macOS column -->
  <rect x="510" y="100" width="152" height="186" rx="10" fill="#fff" filter="url(#sh2)"/>
  <text x="586" y="122" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#7c3aed">macOS</text>
  <text x="522" y="142" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">Iconset PNGs</text>
  <text x="650" y="142" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#374151">10 files</text>
  <text x="522" y="158" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">ICNS Bundle</text>
  <text x="650" y="158" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#374151">1 file</text>
  <text x="522" y="174" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">Range</text>
  <text x="650" y="174" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#374151">16 to 1024px</text>
