  <text x="262" y="122" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#6c8ff5">iOS</text>
  <text x="198" y="142" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">AppIcon Set</text>
  <text x="326" y="142" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#374151">18 files</text>
  <text x="198" y="158" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">App Store</text>
  <text x="326" y="158" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#374151">1024x1024</text>
  <text x="198" y="174" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">Contents.json</text>
  <text x="326" y="174" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#374151">1 file</text>
  <line x1="198" y1="186" x2="326" y2="186" stroke="#e8ecf4" stroke-width="1"/>
  <text x="262" y="208" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#6c8ff5">20 files total</text>
  <text x="262" y="226" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#9ca3af">Xcode-ready asset catalog</text>

  <!-- Windows column -->
  <rect x="348" y="100" width="152" height="186" rx="10" fill="#fff" filter="url(#sh2)"/>
  <text x="424" y="122" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#0284c7">Windows</text>
  <text x="360" y="142" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">PNG Sizes</text>
  <text x="488" y="142" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#374151">10 files</text>
  <text x="360" y="158" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">ICO Bundle</text>
  <text x="488" y="158" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#374151">1 file</text>
  <text x="360" y="174" font-family="system-ui,sans-serif" font-size="10" fill="#6b7280">Range</text>
  <text x="488" y="174" text-anchor="end" font-family="system-ui,sans-serif" font-size="10" font-weight="600" fill="#374151">16 to 256px</text>
